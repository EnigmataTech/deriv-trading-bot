[project]
name = "mcp-trading-server"
version = "0.1.0"
description = "MCP Trading Server with Deriv API integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastmcp>=2.11.0",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.42",
    "stytch>=13.12.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "slowapi>=0.1.9",
]

[tool.setuptools]
py-modules = ["main", "database", "deriv_client", "logger", "trade_monitor"]
